name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build md2loop/md2loop.csproj -c Release -r win-x64

      - name: Publish (x64)
        run: |
          dotnet publish md2loop/md2loop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -o publish/win-x64

      # Guards the Microsoft Store packaging path (issue #42). The default build
      # above stays unpackaged; this proves the MSIX variant still packages.
      # Unsigned on purpose: Microsoft re-signs Store submissions after certification.
      - name: Build MSIX package (Store)
        run: |
          dotnet build md2loop/md2loop.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=MSIX

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: md2loop-msix-x64
          path: md2loop/AppPackages/**/*.msix
          if-no-files-found: error
