name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      # An ARM64 break should not hide the x64 result, and vice versa.
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build md2loop/md2loop.csproj -c Release -r ${{ matrix.rid }}

      # Deliberately identical to release.yml and installer/build.ps1 so CI
      # validates what actually ships. IncludeNativeLibrariesForSelfExtract in
      # particular changes what ends up inside the single file.
      - name: Publish
        run: |
          dotnet publish md2loop/md2loop.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/${{ matrix.rid }}

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: md2loop-${{ matrix.rid }}-ci
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7
